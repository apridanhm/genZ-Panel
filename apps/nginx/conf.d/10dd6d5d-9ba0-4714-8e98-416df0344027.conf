# HTTP to HTTPS Redirect
server {
    listen 80;
    server_name cr7.genzpanel.local;
    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name cr7.genzpanel.local;
    client_max_body_size 50M;

    ssl_certificate /home/genZ-panel/apps/ssl/letsencrypt/10dd6d5d-9ba0-4714-8e98-416df0344027/cert.pem;
    ssl_certificate_key /home/genZ-panel/apps/ssl/letsencrypt/10dd6d5d-9ba0-4714-8e98-416df0344027/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://10.4.60.239:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
