server {
    listen 80;
    server_name flawless-victory.genzpanel.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name flawless-victory.genzpanel.local;
    client_max_body_size 50M;

    ssl_certificate /etc/nginx/ssl/letsencrypt/41b67f46-12aa-445b-ad61-5236696a5105/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/letsencrypt/41b67f46-12aa-445b-ad61-5236696a5105/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    location / {
        proxy_pass http://10.4.60.239:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
