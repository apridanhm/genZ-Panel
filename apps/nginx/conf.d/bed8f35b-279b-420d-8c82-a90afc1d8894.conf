server {
    listen 80;
    server_name proving-ground.genzpanel.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name proving-ground.genzpanel.local;
    client_max_body_size 50M;

    ssl_certificate /home/genZ-panel/apps/ssl/letsencrypt/bed8f35b-279b-420d-8c82-a90afc1d8894/cert.pem;
    ssl_certificate_key /home/genZ-panel/apps/ssl/letsencrypt/bed8f35b-279b-420d-8c82-a90afc1d8894/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://app-f52ec696-f0a4-488a-8e43-15b467a9af8d:5012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
